name: Compilar EXE portable (Windows)

on:
  workflow_dispatch:      # permite lanzarlo manualmente desde la pestaña "Actions"
  push:
    branches: [ "main" ]  # tambien se lanza solo al subir cambios a la rama main

jobs:
  build:
    runs-on: windows-latest   # compila en una maquina Windows real, en la nube

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller send2trash

      - name: Compilar ejecutable portable (un solo archivo)
        run: |
          pyinstaller --onefile --windowed --name DuplicateFinder duplicate_finder.py

      - name: Publicar el .exe para descargar
        uses: actions/upload-artifact@v4
        with:
          name: DuplicateFinder-portable-exe
          path: dist/DuplicateFinder.exe
